<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <meta name="google-client-id" content="457752528049-p2o4m3ip72v5fl96u9glau80opr1nl8j.apps.googleusercontent.com">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css?v=3.2.0">
  <title>Sign in | Spendly Pro</title>
</head>
<body class="marketing-body">
  <main class="auth-page">
    <!-- Brand navigation header -->
    <nav class="marketing-nav" aria-label="Authentication navigation">
      <a class="marketing-brand" href="index.html"><span class="brand-badge">PRO</span><strong>Spendly</strong></a>
    </nav>
    
    <!-- Centered login card container -->
    <div class="auth-container">
      <section class="auth-panel" aria-labelledby="auth-title">
        <a class="back-link" href="index.html">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span>Back to Spendly</span>
        </a>
        
        <span class="welcome-mark">S</span>
        <span class="eyebrow">PRIVATE SIGN-IN</span>
        <h1 id="auth-title">Bring your workspace<br><em>with you.</em></h1>
        <p>Connect Google Drive to keep one private backup in Drive's hidden app-data area. Spendly does not access your other files.</p>
        
        <div class="auth-actions" style="justify-content: center;">
          <!-- Premium authentic Google Login Button -->
          <button class="btn-primary auth-google" onclick="signInWithGoogle()" style="max-width: 320px; margin: 0 auto;">
            <svg class="google-logo-svg" viewBox="0 0 24 24" width="18" height="18">
              <path fill="#ea4335" d="M12 5.04c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.5 15 0 12 0 7.3 0 3.4 2.7 1.6 6.6l3.9 3c.9-2.7 3.4-4.56 6.5-4.56z"/>
              <path fill="#4285f4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.4h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
              <path fill="#fbbc05" d="M5.5 14.4c-.2-.6-.4-1.3-.4-2s.2-1.4.4-2l-3.9-3C.8 8.8.2 10.3.2 12c0 1.7.6 3.2 1.4 4.6l3.9-3.2z"/>
              <path fill="#34a853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.6-1.9-6.5-4.6l-3.9 3c1.8 3.9 5.7 6.6 10.4 6.6z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
        </div>
        
        <div id="auth-status" class="welcome-auth-status" role="status" aria-live="polite"></div>
      </section>
    </div>
    <footer style="width: 100%; max-width: 480px; margin: 24px auto 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-muted);">
      <span>© 2026 Spendly Pro. All rights reserved.</span>
      <div style="display: flex; gap: 12px;">
        <a href="privacy.html" style="color: inherit; text-decoration: none;">Privacy Policy</a>
        <a href="terms.html" style="color: inherit; text-decoration: none;">Terms of Service</a>
      </div>
    </footer>
  </main>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/app.js?v=3.2.0"></script>
</body>
</html>
